<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой сайт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      background: url('bg.jpg') center center / 100% 100% no-repeat fixed;
      position: relative;
    }
    .gothic-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 85vw;
      max-width: 85vw;
      height: 100vh;
      margin: 0 auto;
      text-align: center;
      white-space: nowrap;
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 12.5vw;
      line-height: 1;
      font-weight: 400;
      color: #000;
      animation: flicker-color 4s infinite;
      transform: scaleY(3.4);
      transform-origin: center center;
      pointer-events: none;
    }
    @keyframes flicker-color {
      0% { color: #000; }
      49.9% { color: #000; }
      50% { color: #fff; }
      100% { color: #fff; }
    }
  </style>
</head>
<body>
  <div class="gothic-title">13roxxide</div>
</body>
</html>
