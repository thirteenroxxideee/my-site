<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой сайт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      background: url('bg.jpg') center center / 100% 100% no-repeat fixed;
      position: relative;
    }
    .title-wrap {
      position: relative;
      width: 85vw;
      max-width: 85vw;
      height: 100vh;
      margin: 0 auto;
      overflow: hidden;
    }
    .title-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    .gothic-title {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100%;
      height: 100%;
      margin: 0 auto;
      text-align: center;
      white-space: nowrap;
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 12.5vw;
      line-height: 1;
      font-weight: 400;
      color: #000;
      animation: flicker-color 4s infinite;
      transform: scaleY(3.4);
      transform-origin: center center;
      pointer-events: none;
    }
    @keyframes flicker-color {
      0% { color: #000; }
      49.9% { color: #000; }
      50% { color: #fff; }
      100% { color: #fff; }
    }
    .sc-player {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }
    .custom-player {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      background: url('player-bg.jpg') center center / 100% 100% no-repeat;
      color: #fff;
      text-shadow: 0 1px 3px #000, 0 0 6px #000;
      border: 1px solid #444;
      border-radius: 0;
      padding: 10px 12px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      max-width: 240px;
    }
    .custom-player-label {
      margin-bottom: 8px;
      color: #fff;
      white-space: normal;
    }
    .custom-player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .play-toggle {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 0;
      padding: 6px 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
    }
    .volume-slider {
      width: 100px;
      border-radius: 0;
      accent-color: #fff;
      cursor: pointer;
    }
    .attribution {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      text-align: right;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #fff;
      text-shadow: 0 1px 3px #000, 0 0 6px #000;
    }
    .attribution a {
      color: #fff;
      text-shadow: 0 1px 3px #000, 0 0 6px #000;
    }
  </style>
</head>
<body>
  <div class="title-wrap">
    <img class="title-gif" src="text-bg.gif" alt="">
    <div class="gothic-title">13roxxide</div>
  </div>

  <div class="custom-player">
    <div class="custom-player-label">more lost flp beats — 17:57–18:54 loop</div>
    <div class="custom-player-controls">
      <button id="play-toggle" class="play-toggle" type="button">▶ Play</button>
      <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>

  <iframe id="sc-player" class="sc-player" title="SoundCloud player" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fyume%2Flost-flp-beats-2&amp;color=%23000000&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false"></iframe>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    (function () {
      var iframe = document.getElementById('sc-player');
      var widget = SC.Widget(iframe);
      var playbackStarted = false;

      function startSegment() {
        widget.seekTo(1077000);
        widget.play();
      }

      widget.bind(SC.Widget.Events.READY, function () {
        widget.setVolume(80);
        startSegment();
      });

      var playToggle = document.getElementById('play-toggle');
      var volumeSlider = document.getElementById('volume-slider');
      var isPlaying = false;

      widget.bind(SC.Widget.Events.PLAY, function () {
        playbackStarted = true;
        isPlaying = true;
        playToggle.textContent = '❚❚ Pause';
      });

      widget.bind(SC.Widget.Events.PAUSE, function () {
        isPlaying = false;
        playToggle.textContent = '▶ Play';
      });

      playToggle.addEventListener('click', function () {
        if (!playbackStarted) {
          startSegment();
          return;
        }
        widget.isPaused(function (isPaused) {
          if (isPaused) {
            widget.play();
          } else {
            widget.pause();
          }
        });
      });

      volumeSlider.addEventListener('input', function () {
        widget.setVolume(parseInt(volumeSlider.value, 10));
      });

      widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (event) {
        if (event.currentPosition >= 1134000) {
          widget.seekTo(1077000);
          widget.play();
        }
      });

      widget.bind(SC.Widget.Events.FINISH, function () {
        widget.seekTo(1077000);
        widget.play();
      });

      function startOnFirstInteraction() {
        if (!playbackStarted) {
          startSegment();
        }
      }
      document.addEventListener('click', startOnFirstInteraction);
      document.addEventListener('touchstart', startOnFirstInteraction);
      document.addEventListener('keydown', startOnFirstInteraction);
    })();
  </script>

  <div class="attribution">
    <div>Beats by hyaketekehatkeha0345</div>
    <a href="https://on.soundcloud.com/437MQknv9hBVdS7XaI" target="_blank" rel="noopener">Beat pack on SoundCloud</a>
  </div>
</body>
</html>
